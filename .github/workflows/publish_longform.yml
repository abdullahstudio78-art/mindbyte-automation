name: Publish Long-Form Video

on:
  # Weekly auto-schedule enabled 2026-07-23 - user reviewed run #9 (the
  # first run using the new footage-only cinematic pipeline + real-frame
  # thumbnail, commit 3d6f3cf) and approved: real human B-roll matching the
  # storyboard, clean cinematic thumbnail ("Silent Ruin", 8:21, quality
  # score 9), pre-publish checklist passed. Long-form is weekly (not
  # daily, per the "daily Shorts + weekly long-form" plan) - Sundays,
  # a few hours after the Weekly Content Review (12:00 UTC) and outside
  # the daily Shorts publish window (14:00 UTC), so it doesn't compete for
  # GitHub Actions runners with either.
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch: {}

jobs:
  publish-longform:
    runs-on: ubuntu-latest
    # Longer than the Shorts workflow's 30 minutes - a paragraph-chunked
    # 8-15 minute video means more TTS calls, more Pexels downloads, and a
    # much longer ffmpeg render/concat than a 30-60 second Short.
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        # 2026-08-21: this had only ever gotten the FIRST fix (apt retry
        # loop), not the later static-binary fix applied to publish.yml
        # after run #101/#106 showed apt/CDN mirrors can each hang or have
        # connectivity blips with no bounded timeout. Brought in sync with
        # publish.yml's current approach - see that workflow's comment for
        # the full history.
        timeout-minutes: 6
        run: |
          set -e
          install_static() {
            curl -fL --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 3 \
              -o /tmp/ffmpeg.tar.xz "$1" || return 1
            mkdir -p /tmp/ffmpeg-extract
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
            sudo mv /tmp/ffmpeg-extract/ffmpeg /tmp/ffmpeg-extract/ffprobe /usr/local/bin/
          }

          if install_static "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; then
            echo "[ffmpeg install] installed via johnvansickle.com"
            ffmpeg -version
          elif install_static "https://www.johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; then
            echo "[ffmpeg install] installed via www.johnvansickle.com (primary host was unreachable)"
            ffmpeg -version
          else
            echo "[ffmpeg install] static build sources unreachable - falling back to apt (bounded per attempt)"
            for i in 1 2; do
              if timeout 90 sudo apt-get update && timeout 90 sudo apt-get install -y ffmpeg; then
                ffmpeg -version
                exit 0
              fi
              echo "[ffmpeg install] apt attempt $i failed/timed out, retrying in 5s"
              sleep 5
            done
            echo "[ffmpeg install] all sources failed"
            exit 1
          fi

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 90 pip install -r requirements.txt && exit 0
            echo "[pip install] attempt $i failed/timed out, retrying in 5s"
            sleep 5
          done
          echo "[pip install] all attempts failed"
          exit 1

      - name: Run long-form pipeline
        # 2026-08-21: same fix as publish.yml's "Run pipeline" step - give
        # this its own bounded timeout (well under the job's 75-minute
        # ceiling) so a stall fails as a real "failure" (alerting fires)
        # instead of silently hitting the job timeout and getting
        # "cancelled" (which if: failure() below would NOT catch).
        timeout-minutes: 65
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python pipeline_longform.py

      - name: Alert on failure (2026-08-18 permanent fix - no more silent outages)
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Publish Long-Form Video"
          github-token: ${{ secrets.GITHUB_TOKEN }}
