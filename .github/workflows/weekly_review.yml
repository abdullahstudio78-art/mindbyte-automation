name: Weekly Content Review

on:
  # Sundays at 12:00 UTC - after a full week of daily analytics_sync.py runs
  # have kept view/like/comment/share counts current, so this has a full
  # week of real data to judge against before generating next week's plan.
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 90 pip install requests && exit 0
            echo "[pip install] attempt $i failed/timed out, retrying in 5s"
            sleep 5
          done
          echo "[pip install] all attempts failed"
          exit 1

      - name: Run weekly content review
        timeout-minutes: 12
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python weekly_review.py

      - name: Alert on failure (2026-08-18 permanent fix - no more silent outages)
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Weekly Content Review"
          github-token: ${{ secrets.GITHUB_TOKEN }}
