name: Playlist Backfill (manual)

# One-off (but safe to re-run) backfill of back-catalog videos into their
# pillar+format playlists - see playlist_backfill.py for full details.
# Manual trigger only: this is not something that needs to run on a
# schedule, it's a single sweep over existing videos plus a safety net for
# any published-before-playlists-shipped video that slips through later.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run playlist backfill
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python playlist_backfill.py
