name: Community Engagement - Publish Approved Comments

on:
  # Daily, offset from every other workflow's schedule (analytics 06:00,
  # publish 02:00/14:00, weekly_review/external_trends Sundays) so it never
  # competes for runners. Only ever posts rows YOU have already approved
  # in the CommentQueue sheet tab (Approved=TRUE) - see
  # community_engagement.py's mode_publish() and
  # docs/community-engagement.md for why this can never auto-approve
  # itself (YouTube API policy requires your prior express consent per
  # comment, not just per workflow run).
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Publish today's approved, scheduled comments (up to the daily limit)
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python community_engagement.py publish
