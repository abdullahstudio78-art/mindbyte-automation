name: Facebook Weekly Content Review

on:
  # Added 2026-08-19. Sundays at 13:00 UTC - 1 hour after the existing
  # Weekly Content Review (YouTube, 12:00 UTC) so they don't compete for a
  # runner slot, and after a full week of daily facebook_analytics.py
  # snapshots have accumulated for this week's Facebook posts.
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # facebook_weekly_review.py imports pipeline.py for its Sheets/
        # Groq helpers, so it needs the full dependency set.
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 90 pip install -r requirements.txt && exit 0
            echo "[pip install] attempt $i failed/timed out, retrying in 5s"
            sleep 5
          done
          echo "[pip install] all attempts failed"
          exit 1

      - name: Run Facebook weekly content review
        timeout-minutes: 12
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python facebook_weekly_review.py

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Facebook Weekly Content Review"
          github-token: ${{ secrets.GITHUB_TOKEN }}
