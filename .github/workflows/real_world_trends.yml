name: Real-World Psychology Trend Sourcing

on:
  # Sundays at 09:00 UTC - before external_trends.yml (10:00) and both
  # weekly reviews (12:00/13:00), so any real-world-sourced briefs this
  # writes to NextWeekQueue are already sitting there, available to
  # select_topic_for_run(), well before this week's first publish run.
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch: {}

jobs:
  real_world_trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # real_world_trends.py imports pipeline.py for its Sheets/Groq
        # helpers, same as facebook_weekly_review.py - needs the full set.
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 90 pip install -r requirements.txt && exit 0
            echo "[pip install] attempt $i failed/timed out, retrying in 5s"
            sleep 5
          done
          echo "[pip install] all attempts failed"
          exit 1

      - name: Run real-world psychology trend sourcing
        timeout-minutes: 8
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python real_world_trends.py

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Real-World Psychology Trend Sourcing"
          github-token: ${{ secrets.GITHUB_TOKEN }}
