name: Community Engagement - Generate Batch

on:
  # Monthly, 1st of the month at 08:00 UTC - drafts ~30 days worth of
  # candidate comments (BATCH_DAYS * DAILY_COMMENT_LIMIT in
  # community_engagement_config.py) for you to review/approve in one
  # sitting. Also runnable any time via workflow_dispatch if you want a
  # fresh batch sooner (it dedupes against already-seen videos, so running
  # it early/twice is harmless).
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 2026-08-21: this workflow had NO failure alerting at all - a broken
    # run here (Groq down, Sheets auth expired, whatever) would fail
    # completely silently, forever, with zero notification. Added the same
    # alert-on-failure step every other workflow already has.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 90 pip install requests && exit 0
            echo "[pip install] attempt $i failed/timed out, retrying in 5s"
            sleep 5
          done
          echo "[pip install] all attempts failed"
          exit 1

      - name: Draft a new comment batch (writes drafts only, never posts)
        timeout-minutes: 15
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python community_engagement.py generate

      - name: Reminder
        run: |
          echo "::notice::New batch drafted into the CommentQueue sheet tab as pending_review."
          echo "::notice::Nothing will be posted until you set Approved=TRUE on the rows you want published."

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Community Engagement - Generate Batch"
          github-token: ${{ secrets.GITHUB_TOKEN }}
