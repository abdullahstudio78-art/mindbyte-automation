name: Publish Video

on:
  # Daily auto-schedule enabled 2026-07-19 - user approved quality after runs
  # #22 and #23 passed the full pipeline (idea-scoring, storytelling script,
  # pillar-matched voice/music, pre-publish checklist) and were reviewed and
  # published by the user. Ran at 1/day for the first ~2 weeks per the
  # posting-frequency research's re-evaluation window.
  #
  # BUMPED TO 2/DAY on 2026-08-01 (user's explicit decision, after the
  # 1/day trial period) - two runs 12h apart (02:00 and 14:00 UTC) rather
  # than back-to-back, so the two videos land at different points in the
  # day for a global audience instead of clustering together. Paired with
  # raising NEW_SHORTS_IDEAS_PER_WEEK in weekly_review.py from 5 to 14 so
  # the self-improving queue can actually keep up with 2/day consumption -
  # doubling the publish rate without doubling the brief supply would have
  # meant most videos silently fell back to the original random topic
  # picker instead of using the weekly-informed briefs.
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        # 2026-08-19: run #97 hung on apt-get for the full 30min job
        # timeout and got silently cancelled. Added a dedicated step
        # timeout + apt retry loop as a first fix - but run #101 showed
        # that doesn't actually fix a slow/stalled apt mirror: retrying
        # `apt-get update` 3 times just re-hits the same flaky mirror and
        # still burns the whole 5-minute step budget with nothing to show
        # for it (annotation: "The action 'Install ffmpeg' has timed out
        # after 5 minutes").
        #
        # Real fix: stop depending on apt mirrors for this at all. Pull a
        # static, self-contained ffmpeg build directly from a CDN
        # (johnvansickle.com's well-known static builds, used widely in
        # CI for exactly this reason) - one file download instead of an
        # apt-get update against a package index, so it isn't exposed to
        # mirror sync/availability flakiness. Falls back to apt only if
        # the static download itself fails.
        timeout-minutes: 5
        run: |
          set -e
          if curl -fL --retry 3 --retry-delay 5 -o /tmp/ffmpeg.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; then
            mkdir -p /tmp/ffmpeg-extract
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
            sudo mv /tmp/ffmpeg-extract/ffmpeg /tmp/ffmpeg-extract/ffprobe /usr/local/bin/
            ffmpeg -version
          else
            echo "[ffmpeg install] static build download failed, falling back to apt"
            for i in 1 2 3; do
              sudo apt-get update && sudo apt-get install -y ffmpeg && exit 0
              echo "[ffmpeg install] apt attempt $i failed, retrying in 10s"
              sleep 10
            done
            echo "[ffmpeg install] all attempts failed"
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # TikTok cross-post (added 2026-07-23) - tiktok_publish.py no-ops
          # cleanly if these aren't set yet (app registration/audit still
          # pending), so this is safe to leave in place before setup finishes.
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL }}
          # Facebook cross-post (added 2026-08-19) - facebook_publish.py
          # no-ops cleanly if these aren't set.
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python pipeline.py

      - name: Alert on failure (2026-08-18 permanent fix - no more silent outages)
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Publish Video"
          github-token: ${{ secrets.GITHUB_TOKEN }}
