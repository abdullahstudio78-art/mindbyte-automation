name: Publish Video

on:
  # Daily auto-schedule enabled 2026-07-19 - user approved quality after runs
  # #22 and #23 passed the full pipeline (idea-scoring, storytelling script,
  # pillar-matched voice/music, pre-publish checklist) and were reviewed and
  # published by the user. Ran at 1/day for the first ~2 weeks per the
  # posting-frequency research's re-evaluation window.
  #
  # BUMPED TO 2/DAY on 2026-08-01 (user's explicit decision, after the
  # 1/day trial period) - two runs 12h apart (02:00 and 14:00 UTC) rather
  # than back-to-back, so the two videos land at different points in the
  # day for a global audience instead of clustering together. Paired with
  # raising NEW_SHORTS_IDEAS_PER_WEEK in weekly_review.py from 5 to 14 so
  # the self-improving queue can actually keep up with 2/day consumption -
  # doubling the publish rate without doubling the brief supply would have
  # meant most videos silently fell back to the original random topic
  # picker instead of using the weekly-informed briefs.
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        # 2026-08-19: run #97 hung on apt-get for the full 30min job
        # timeout and got silently cancelled. Added a dedicated step
        # timeout + apt retry loop as a first fix - but run #101 showed
        # that doesn't actually fix a slow/stalled apt mirror: retrying
        # `apt-get update` 3 times just re-hits the same flaky mirror and
        # still burns the whole 5-minute step budget with nothing to show
        # for it. Switched to a static-binary download from johnvansickle.com
        # as a second fix - but run #106 showed THAT source can itself have
        # a connectivity blip (curl: "Failed to connect to johnvansickle.com
        # port 443 after 133791 ms"), and because no attempt had a bounded
        # connect timeout, curl spent 2+ minutes per attempt failing to even
        # connect, burning the whole step budget on dead connections before
        # ever reaching the apt fallback.
        #
        # Real fix (this time addressing the actual root cause, not just
        # swapping which single source can hang): every network attempt
        # below now has an explicit --connect-timeout/--max-time (curl) or
        # `timeout` wrapper (apt), so a stalled/dead connection to ANY one
        # source fails in seconds, not minutes - leaving the step time to
        # actually try the next source in the chain instead of losing the
        # whole budget to whichever source happens to be down that day.
        # Chain: static build (primary host) -> static build (www mirror,
        # same file, different DNS name/edge) -> apt (bounded, 2 attempts).
        timeout-minutes: 6
        run: |
          set -e
          install_static() {
            curl -fL --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 3 \
              -o /tmp/ffmpeg.tar.xz "$1" || return 1
            mkdir -p /tmp/ffmpeg-extract
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
            sudo mv /tmp/ffmpeg-extract/ffmpeg /tmp/ffmpeg-extract/ffprobe /usr/local/bin/
          }

          if install_static "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; then
            echo "[ffmpeg install] installed via johnvansickle.com"
            ffmpeg -version
          elif install_static "https://www.johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; then
            echo "[ffmpeg install] installed via www.johnvansickle.com (primary host was unreachable)"
            ffmpeg -version
          else
            echo "[ffmpeg install] static build sources unreachable - falling back to apt (bounded per attempt)"
            for i in 1 2; do
              if timeout 90 sudo apt-get update && timeout 90 sudo apt-get install -y ffmpeg; then
                ffmpeg -version
                exit 0
              fi
              echo "[ffmpeg install] apt attempt $i failed/timed out, retrying in 5s"
              sleep 5
            done
            echo "[ffmpeg install] all sources failed"
            exit 1
          fi

      - name: Install dependencies
        # Bounded the same way as ffmpeg above (2026-08-21) - a stalled
        # PyPI mirror would otherwise be able to eat the whole job here too.
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 90 pip install -r requirements.txt && exit 0
            echo "[pip install] attempt $i failed/timed out, retrying in 5s"
            sleep 5
          done
          echo "[pip install] all attempts failed"
          exit 1

      - name: Run pipeline
        # 2026-08-21: runs #97 and #104 both silently ran the full 30-minute
        # JOB timeout and got cancelled - no video, no failure email, nothing
        # in the run log past the first line. Root cause: this step had no
        # timeout of its own, so when something inside pipeline.py stalls
        # (most likely Groq API rate-limit backoffs compounding across the
        # several chained calls a single run makes - topic idea-scoring,
        # script generation/retries, storyboard, compliance - each with its
        # own legitimate wait-and-retry logic that can stack up under
        # sustained throttling), the only thing that ever stopped it was the
        # JOB's 30-minute ceiling. A job that hits ITS OWN timeout is marked
        # "cancelled", and `if: failure()` below does NOT fire for a
        # cancelled run - so these two runs failed completely silently.
        # Giving this step its own shorter timeout fixes that: when a STEP
        # times out, the step (and job) conclusion is "failure", not
        # "cancelled" - so the Alert on failure step below actually fires
        # and emails a real notification instead of going dark.
        timeout-minutes: 22
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # TikTok cross-post (added 2026-07-23) - tiktok_publish.py no-ops
          # cleanly if these aren't set yet (app registration/audit still
          # pending), so this is safe to leave in place before setup finishes.
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL }}
          # Facebook cross-post (added 2026-08-19) - facebook_publish.py
          # no-ops cleanly if these aren't set.
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python pipeline.py

      - name: Alert on failure (2026-08-18 permanent fix - no more silent outages)
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Publish Video"
          github-token: ${{ secrets.GITHUB_TOKEN }}
