name: Analytics Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 90 pip install requests && exit 0
            echo "[pip install] attempt $i failed/timed out, retrying in 5s"
            sleep 5
          done
          echo "[pip install] all attempts failed"
          exit 1

      - name: Run analytics sync
        timeout-minutes: 12
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python analytics_sync.py

      - name: Alert on failure (2026-08-18 permanent fix - no more silent outages)
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Analytics Sync"
          github-token: ${{ secrets.GITHUB_TOKEN }}
