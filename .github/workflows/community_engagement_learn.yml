name: Community Engagement - Learning Sync

on:
  # Weekly, Sundays 11:00 UTC - after external_trends.yml (10:00) and
  # before weekly_review.yml (12:00), so any engagement signal collected
  # here is available in time for that week's Groq report.
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch: {}

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 2026-08-21: this workflow had no failure alerting at all - fixed the
    # same way as every other workflow (see publish.yml's history).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 90 pip install requests && exit 0
            echo "[pip install] attempt $i failed/timed out, retrying in 5s"
            sleep 5
          done
          echo "[pip install] all attempts failed"
          exit 1

      - name: Check engagement on previously-posted comments
        timeout-minutes: 10
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python community_engagement.py learn

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Community Engagement - Learning Sync"
          github-token: ${{ secrets.GITHUB_TOKEN }}
