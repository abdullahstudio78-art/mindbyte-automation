name: Publish Facebook Reel

on:
  # Added 2026-08-19 per explicit user request: 5 Facebook Reels/day,
  # decoupled from YouTube's own 2/day cadence. 2 of the 5 already happen
  # "for free" as a byproduct of publish.yml's Facebook cross-post (fires
  # at 02:00 and 14:00 UTC alongside each YouTube Short). THIS workflow
  # supplies the other 3/day, independently - own topic, own script, own
  # footage, own render, own post, no YouTube upload involved - so the
  # combined schedule across both workflows is:
  #   02:00 UTC - publish.yml (YouTube Short + Facebook cross-post)
  #   06:00 UTC - publish_facebook.yml (Facebook only)
  #   10:00 UTC - publish_facebook.yml (Facebook only)
  #   14:00 UTC - publish.yml (YouTube Short + Facebook cross-post)
  #   18:00 UTC - publish_facebook.yml (Facebook only)
  # = 5 Facebook posts/day, spread across the day rather than clustered,
  # same reasoning as publish.yml's own 12h-apart spacing.
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        # Same bounded-timeout, multi-source approach as publish.yml
        # (2026-08-19, revised after run #106 showed the static-binary CDN
        # itself can have a connectivity blip with no bounded timeout on
        # the attempt - see that workflow's comment for the full history).
        # Kept in sync between the two workflows.
        timeout-minutes: 6
        run: |
          set -e
          install_static() {
            curl -fL --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 3 \
              -o /tmp/ffmpeg.tar.xz "$1" || return 1
            mkdir -p /tmp/ffmpeg-extract
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
            sudo mv /tmp/ffmpeg-extract/ffmpeg /tmp/ffmpeg-extract/ffprobe /usr/local/bin/
          }

          if install_static "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; then
            echo "[ffmpeg install] installed via johnvansickle.com"
            ffmpeg -version
          elif install_static "https://www.johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; then
            echo "[ffmpeg install] installed via www.johnvansickle.com (primary host was unreachable)"
            ffmpeg -version
          else
            echo "[ffmpeg install] static build sources unreachable - falling back to apt (bounded per attempt)"
            for i in 1 2; do
              if timeout 90 sudo apt-get update && timeout 90 sudo apt-get install -y ffmpeg; then
                ffmpeg -version
                exit 0
              fi
              echo "[ffmpeg install] apt attempt $i failed/timed out, retrying in 5s"
              sleep 5
            done
            echo "[ffmpeg install] all sources failed"
            exit 1
          fi

      - name: Install dependencies
        # Bounded the same way as ffmpeg above (2026-08-21).
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 90 pip install -r requirements.txt && exit 0
            echo "[pip install] attempt $i failed/timed out, retrying in 5s"
            sleep 5
          done
          echo "[pip install] all attempts failed"
          exit 1

      - name: Run Facebook-only pipeline
        # 2026-08-21: same fix as publish.yml's "Run pipeline" step - this
        # calls the same pipeline.py internals (topic selection, script
        # generation, Groq calls with their own retry/backoff), so it's
        # exposed to the same "silently hits the 30-min job ceiling and gets
        # cancelled with no failure email" risk. See publish.yml's comment
        # for the full explanation of why a step-level timeout (not just the
        # job-level one) is what makes the Alert-on-failure step actually fire.
        #
        # 2026-08-22: bumped 22->26 (see publish.yml's matching comment) -
        # PYTHONUNBUFFERED=1 added at job level so a stall is actually
        # visible in logs, and 26 gives normal-but-slow runs more room
        # while still leaving safety margin under the 30-min job ceiling.
        timeout-minutes: 26
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # OAuth/Sheet creds are needed even though this workflow never
          # touches YouTube upload - facebook_pipeline.py reuses
          # pipeline.py's Sheets-backed topic selection, VideoMeta-style
          # logging, and CTA/structure rotation helpers, all of which read
          # from the same Google Sheet as the YouTube pipeline.
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python facebook_pipeline.py

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Publish Facebook Reel"
          github-token: ${{ secrets.GITHUB_TOKEN }}
